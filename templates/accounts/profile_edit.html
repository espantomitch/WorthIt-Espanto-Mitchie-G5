{% extends 'base.html' %}
{% block title %}Edit profile · WorthIt{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Edit my profile</h1>
  <p class="muted">Fields marked * are required.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include 'accounts/form_fields.html' %}
    <div class="actions">
      <button class="button" type="submit">Save changes</button>
      <a href="{% url 'accounts:profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
