{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · WorthIt</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header><a class="brand" href="{% url 'home' %}">WorthIt</a></header>
  <main>
    <section class="form-card">
      {% block content %}{% endblock %}
      <a class="button" href="{% url 'home' %}">Return to WorthIt</a>
    </section>
  </main>
</body>
</html>
